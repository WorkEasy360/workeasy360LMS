# Default profile = local, zero-install dev: H2 file database in PostgreSQL-compatibility mode.
# Switch to real PostgreSQL any time with:  mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# (see docker-compose.yml — `docker compose up -d` brings up real Postgres on 5432).
spring:
  application:
    name: workeasy360-backend
  profiles:
    active: ${APP_PROFILE:dev}
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${MAX_VIDEO_MB:500}MB
      max-request-size: ${MAX_VIDEO_MB:500}MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  servlet:
    session:
      # The server-side session a WorkEasy360 sign-in creates (password sign-ins keep their bearer token and never get
      # one). Idle timeout: a person away longer than this signs in again; access ending in WorkEasy360 is enforced
      # separately, by back-channel logout at once and by the entitlement check within 15 minutes.
      timeout: ${LMS_SESSION_IDLE_TIMEOUT:8h}
      tracking-modes: cookie
      cookie:
        # __Host- prefix (only valid with Secure, path / and no Domain): host-only, and a sibling subdomain cannot
        # plant or overwrite it. There is never a .workeasy360.com cookie. Local profiles (plain http) use a plain name.
        name: ${LMS_SESSION_COOKIE_NAME:__Host-lms_session}
        http-only: true
        same-site: lax
        path: /
        secure: ${LMS_SESSION_COOKIE_SECURE:true}

app:
  jwt:
    secret: ${JWT_SECRET:}                 # required (no default). dev profile only: a random per-run key is generated when unset
    expiry-minutes: ${JWT_EXPIRY_MINUTES:720}
  storage:
    root: ${FILE_STORAGE_PATH:./storage}
  video:
    max-mb: ${MAX_VIDEO_MB:500}
  seed:
    enabled: ${APP_SEED_ENABLED:false}     # demo accounts/courses with a published demo password: opt-in (the dev profile turns it on)
  ai:
    enabled: ${AI_ENABLED:false}            # false → deterministic mock provider (no network, no key needed)
    provider: ${AI_PROVIDER:mock}          # mock | openai | anthropic
    api-key: ${AI_API_KEY:}                # never persisted or exposed
    model: ${AI_MODEL:}
    base-url: ${AI_BASE_URL:}              # optional OpenAI-compatible gateway / proxy (e.g. Google Gemini: https://generativelanguage.googleapis.com/v1beta/openai)
    reasoning-effort: ${AI_REASONING_EFFORT:}  # optional, OpenAI-compatible providers only: none | low | medium | high (less = cheaper, faster)
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    max-input-chars: ${AI_MAX_INPUT_CHARS:12000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:4000}
    max-questions: ${AI_MAX_QUESTIONS:25}
    dedupe-minutes: ${AI_DEDUPE_MINUTES:10}
  payments:
    provider: ${PAYMENTS_PROVIDER:none}       # none (purchases refused safely) | mock (development only, needs mock-allowed) | a future real provider
    mock-allowed: ${PAYMENTS_MOCK_ALLOWED:false}
    api-key: ${PAYMENTS_API_KEY:}              # for a real provider; never persisted or exposed
    webhook-secret: ${PAYMENTS_WEBHOOK_SECRET:}
    currency: ${PAYMENTS_CURRENCY:INR}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  mail:                                      # outgoing e-mail; leave SMTP_HOST empty to run without e-mail
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}              # never persisted or exposed
    from: ${SMTP_FROM:}                      # defaults to SMTP_USERNAME
    starttls: ${SMTP_STARTTLS:true}
    ssl: ${SMTP_SSL:}                        # implicit SSL; defaults to true on port 465, false otherwise
  public-url: ${APP_PUBLIC_URL:}             # absolute base for links in e-mails, e.g. https://lms.example.com

# Sign in with WorkEasy360 Accounts (docs/workeasy360-sso.md). The environment variables WORKEASY360_ISSUER,
# WORKEASY360_CLIENT_ID, WORKEASY360_REDIRECT_URI, WORKEASY360_KEY_ID, WORKEASY360_PRIVATE_KEY_FILE (or
# WORKEASY360_PRIVATE_KEY), WORKEASY360_PRODUCT_CODE, WORKEASY360_POST_LOGOUT_REDIRECT_URI, WORKEASY360_SSO_ONLY,
# WORKEASY360_AUTO_PROVISION and WORKEASY360_LINK_BY_VERIFIED_EMAIL bind to these properties. With none of the first five set, WorkEasyLMS runs exactly as
# before (password sign-in only); with some but not all of them, it refuses to start.
workeasy360:
  product-code: ${WORKEASY360_PRODUCT_CODE:workeasy_lms}
  sso-only: ${WORKEASY360_SSO_ONLY:false}
  auto-provision: ${WORKEASY360_AUTO_PROVISION:true}
  link-by-verified-email: ${WORKEASY360_LINK_BY_VERIFIED_EMAIL:false}   # off: existing accounts are linked by an operator
  app-url: ${WORKEASY360_APP_URL:${APP_PUBLIC_URL:}}   # where the single-page app is; empty = this origin

springdoc:
  swagger-ui:
    path: /docs

---
# Local profiles (dev, or `local` added to any other, e.g. APP_PROFILE=postgres,local): plain http on localhost, so
# the session cookie cannot be Secure and cannot carry the __Host- prefix; a loopback WorkEasy360 issuer is allowed.
spring:
  config:
    activate:
      on-profile: "dev | local"
server:
  servlet:
    session:
      cookie:
        name: ${LMS_SESSION_COOKIE_NAME:lms_session}
        secure: ${LMS_SESSION_COOKIE_SECURE:false}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/we360;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE,USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}       # zero-install dev: seed the demo data on an empty database

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:we360}
    username: ${DB_USERNAME:we360}
    password: ${DB_PASSWORD:we360}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
