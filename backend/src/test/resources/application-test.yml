# The backend tests (`mvn test`) run against a real PostgreSQL, the production engine; the multi-instance back-channel
# tests need one database shared by two servers. Without LMS_TEST_DB_URL the database tests are skipped (only the
# configuration unit tests run). A throwaway database is enough, for example a container:
#
#   LMS_TEST_DB_URL=jdbc:postgresql://localhost:5432/lms_test  LMS_TEST_DB_USERNAME=postgres  LMS_TEST_DB_PASSWORD=...
#
# H2 is not an option today: V11__organizations.sql (on main) uses timestamptz, which H2 2.2 refuses, so a fresh H2
# database cannot be migrated past V10 (the dev profile has the same problem).
spring:
  datasource:
    url: ${LMS_TEST_DB_URL:}
    username: ${LMS_TEST_DB_USERNAME:postgres}
    password: ${LMS_TEST_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: lms-backend-tests-signing-secret-0123456789-abcdefghijklmnopqrstuvwxyz
  seed:
    enabled: false
  storage:
    root: ${java.io.tmpdir}/lms-test-storage

logging:
  level:
    org.flywaydb: WARN
